<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pedidos - Cafetería</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff6b00;
            margin-top: 0;
        }

        .estado {
            color: #00ff66;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #lista-pedidos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pedido-card {
            background-color: #2a2a2a;
            border-left: 6px solid #ff6b00;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .hora {
            color: #aaaaaa;
            font-size: 0.85em;
            margin-bottom: 6px;
        }

        .cliente {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 4px;
        }

        .pedido {
            font-size: 1.05em;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <h1>☕ Pedidos Entrantes - Cafetería</h1>
    <div class="estado">🟢 Escuchando pedidos en vivo...</div>

    <div id="lista-pedidos"></div>

    <script>
        const NTFY_TOPIC = 'cafeteria_pedidos_valencia';
        const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}`;

        const contenedor = document.getElementById('lista-pedidos');
        const pedidosActivos = new Map(); // Guarda (id -> elemento DOM)

        // 1. Conexión en tiempo real SSE
        const eventSource = new EventSource(`${NTFY_URL}/sse`);

        eventSource.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // Si se crea un nuevo pedido
                if (data.event === 'message') {
                    agregarPedido(data);
                } 
                // Si borras UN pedido en ntfy (PC izquierda)
                else if (data.event === 'message_delete') {
                    eliminarPedido(data.id);
                } 
                // Si limpias TODOS los pedidos en ntfy (PC izquierda)
                else if (data.event === 'message_clear') {
                    limpiarTodos();
                }
            } catch (e) {
                console.error("Error al procesar el mensaje:", e);
            }
        };

        function agregarPedido(data) {
            if (pedidosActivos.has(data.id)) return;

            const card = document.createElement('div');
            card.className = 'pedido-card';
            card.id = `pedido-${data.id}`;

            const horaFormateada = new Date(data.time * 1000).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });

            card.innerHTML = `
                <div class="hora">Hora: ${horaFormateada}</div>
                <div class="cliente">👤 Cliente: ${data.title || 'Cliente'}</div>
                <div class="pedido">☕ Pedido: ${data.message}</div>
            `;

            contenedor.prepend(card);
            pedidosActivos.set(data.id, card);
        }

        function eliminarPedido(id) {
            const card = pedidosActivos.get(id);
            if (card) {
                // Animación de salida fluida
                card.style.opacity = '0';
                card.style.transform = 'translateX(50px)';
                setTimeout(() => {
                    card.remove();
                    pedidosActivos.delete(id);
                }, 300);
            }
        }

        function limpiarTodos() {
            pedidosActivos.forEach((_, id) => eliminarPedido(id));
        }

        // 2. Sincronización de respaldo periódica (cada 2 segundos)
        async function sincronizarConServidor() {
            try {
                const res = await fetch(`${NTFY_URL}/json?poll=1&_t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;

                const text = await res.text();
                const lineas = text.trim().split('\n').filter(l => l.trim().length > 0);
                
                const mensajesServidor = lineas.map(l => JSON.parse(l)).filter(m => m.event === 'message');
                const idsVigentes = new Set(mensajesServidor.map(m => m.id));

                // Si está en la pantalla pero ya fue borrado del servidor de ntfy, lo quita
                pedidosActivos.forEach((_, id) => {
                    if (!idsVigentes.has(id)) {
                        eliminarPedido(id);
                    }
                });
            } catch (e) {
                console.error("Error de sincronización:", e);
            }
        }

        setInterval(sincronizarConServidor, 2000);
    </script>
</body>
</html>
