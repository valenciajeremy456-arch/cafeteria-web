<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pedidos - Cafetería</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { color: #ff6b00; margin: 0; }
        
        .estado { color: #00ff66; font-weight: bold; margin-bottom: 20px; }

        /* Botón de activación de voz */
        .btn-voz {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-voz:hover {
            background-color: #e05e00;
        }

        .btn-voz.activo {
            background-color: #28a745;
        }

        #lista-pedidos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pedido-card {
            background-color: #2a2a2a;
            border-left: 6px solid #ff6b00;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .pedido-card:hover { background-color: #383838; }
        .cliente { font-weight: bold; font-size: 1.1em; }
        .producto { font-size: 1.05em; color: #dddddd; margin-top: 4px; }
        .tip { color: #888888; font-size: 0.8em; margin-top: 8px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header-container">
        <h1>☕ Pedidos Entrantes - Cafetería</h1>
        <button id="btnVoz" class="btn-voz" onclick="toggleVoz()">🔇 Activar lectura por voz</button>
    </div>

    <div class="estado">🟢 Conectado en tiempo real (Google Firebase)</div>

    <div id="lista-pedidos"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cafeteria-colegia-ccb-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('pedidos');
        const contenedor = document.getElementById('lista-pedidos');
        const btnVoz = document.getElementById('btnVoz');

        let vozActivada = false;
        let esCargaInicial = true;

        // Función para activar / desactivar la voz
        function toggleVoz() {
            vozActivada = !vozActivada;
            if (vozActivada) {
                btnVoz.textContent = "🔊 Voz Activada";
                btnVoz.classList.add("activo");
                
                // Confirmación sonora inicial
                reproducirVoz("Lectura de pedidos activada");
            } else {
                btnVoz.textContent = "🔇 Activar lectura por voz";
                btnVoz.classList.remove("activo");
                window.speechSynthesis.cancel();
            }
        }

        // Sintetizador de Voz Nativo del Navegador
        function reproducirVoz(texto) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Cancela lecturas anteriores para evitar acumulaciones

            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES'; // Idioma español
            mensaje.rate = 1.0;     // Velocidad de lectura (1.0 es normal)
            mensaje.pitch = 1.0;    // Tono de voz

            window.speechSynthesis.speak(mensaje);
        }

        // Evita leer pedidos antiguos al cargar o refrescar la página
        setTimeout(() => {
            esCargaInicial = false;
        }, 1500);

        // Escucha en tiempo real cuando entra un pedido nuevo
        db.on('child_added', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();

            if (document.getElementById(`pedido-${id}`)) return;

            const card = document.createElement('div');
            card.className = 'pedido-card';
            card.id = `pedido-${id}`;

            const clienteNombre = typeof data === 'object' ? (data.cliente || 'Cliente') : 'Cliente';
            const productoNombre = typeof data === 'object' ? (data.pedido || data) : data;

            card.innerHTML = `
                <div class="cliente">👤 Cliente: ${clienteNombre}</div>
                <div class="producto">☕ Pedido: ${productoNombre}</div>
                <div class="tip">(Toca o haz clic para despachar y borrar en todas las pantallas)</div>
            `;

            // Si la voz está activa y llega un nuevo pedido, lo lee en voz alta
            if (vozActivada && !esCargaInicial) {
                reproducirVoz(`Nuevo pedido. ${clienteNombre} pide ${productoNombre}`);
            }

            // Al hacer clic borra el pedido en Firebase
            card.addEventListener('click', () => {
                db.child(id).remove();
            });

            contenedor.prepend(card);
        });

        // Elimina el elemento de la pantalla cuando se despacha
        db.on('child_removed', (snapshot) => {
            const id = snapshot.key;
            const card = document.getElementById(`pedido-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => card.remove(), 300);
            }
        });
    </script>
</body>
</html>
