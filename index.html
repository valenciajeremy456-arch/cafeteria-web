<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina en Vivo - Cafetería CCB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f4',
                            500: '#7A1C2E',
                            600: '#661726',
                            700: '#52121e',
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-brand-500 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center p-1 shadow">
                    <svg viewBox="0 0 200 200" class="w-full h-full text-brand-500 fill-current">
                        <circle cx="70" cy="100" r="50" fill="none" stroke="currentColor" stroke-width="16"/>
                        <circle cx="110" cy="100" r="50" fill="none" stroke="currentColor" stroke-width="16"/>
                        <path d="M 130 50 L 170 50 L 170 150 L 130 150 Z" />
                        <ellipse cx="145" cy="115" rx="8" ry="12" fill="white" transform="rotate(-20 145 115)"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg">CAFETERÍA COLEGIAL CCB</h1>
                    <p class="text-xs text-emerald-300 font-bold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        Recepción de Pedidos en Vivo
                    </p>
                </div>
            </div>
            <div class="bg-brand-700 px-3 py-1.5 rounded-lg text-xs font-bold">
                <span id="activeCount">0</span> PEDIDOS ACTIVOS
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-16 text-slate-400 bg-white rounded-2xl border border-dashed">
                <i class="fas fa-utensils text-4xl mb-2 text-brand-500 animate-bounce"></i>
                <p class="font-bold text-slate-700">Esperando nuevos pedidos desde las aulas...</p>
            </div>
        </div>
    </main>

    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const SYNC_CHANNEL = 'https://ntfy.sh/ccb_cafeteria_valencia_2026';
        let localOrders = JSON.parse(localStorage.getItem('ccb_orders') || '[]');

        function saveLocal() {
            localStorage.setItem('ccb_orders', JSON.stringify(localOrders));
            renderOrders();
        }

        function playAlert() {
            const sound = document.getElementById('alertSound');
            if(sound) sound.play().catch(() => {});
        }

        function addOrder(newOrder) {
            if(!localOrders.some(o => o.id === newOrder.id)) {
                localOrders.unshift(newOrder);
                saveLocal();
                playAlert();
            }
        }

        function updateStatus(id, newStatus) {
            const order = localOrders.find(o => o.id === id);
            if(order) {
                order.status = newStatus;
                saveLocal();
            }
        }

        function deleteOrder(id) {
            if(confirm('¿Marcar pedido como completado/entregado?')) {
                localOrders = localOrders.filter(o => o.id !== id);
                saveLocal();
            }
        }

        function renderOrders() {
            document.getElementById('activeCount').innerText = localOrders.length;
            const container = document.getElementById('ordersContainer');

            if(localOrders.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-400 bg-white rounded-2xl border border-dashed">
                        <i class="fas fa-check-circle text-4xl mb-2 text-emerald-500"></i>
                        <p class="font-bold text-slate-700">Sin pedidos pendientes en la cocina</p>
                        <p class="text-xs text-slate-400 mt-1">Los pedidos ingresados en la app aparecerán automáticamente aquí.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = localOrders.map(o => `
                <div class="bg-white rounded-2xl shadow-sm border-2 ${o.status === 'RECIBIDO' ? 'border-amber-400' : o.status === 'PREPARANDO' ? 'border-blue-400' : 'border-emerald-400'} p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3 pb-2 border-b">
                            <div>
                                <span class="text-xs font-bold text-slate-400">${o.id}</span>
                                <div class="text-2xl font-black text-brand-500">Salón ${o.room}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.status === 'RECIBIDO' ? 'bg-amber-100 text-amber-800' : o.status === 'PREPARANDO' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'}">
                                ${o.status}
                            </span>
                        </div>

                        <div class="text-xs bg-slate-50 p-2.5 rounded-xl mb-3 space-y-1">
                            <div><b class="text-slate-500">Docente:</b> <span class="font-bold text-slate-800">${o.teacher}</span></div>
                            <div><b class="text-slate-500">Recoge:</b> <span class="font-bold text-emerald-700">${o.student}</span></div>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-xl mb-3">
                            <div class="text-xs font-bold text-slate-400 uppercase mb-1">Productos:</div>
                            <ul class="space-y-1 text-sm font-medium">
                                ${o.items.map(i => `<li class="flex justify-between"><span><b class="text-brand-600">${i.qty}x</b> ${i.name}</span> <span>$${(i.price * i.qty).toLocaleString()}</span></li>`).join('')}
                            </ul>
                        </div>

                        ${o.note ? `<div class="p-2.5 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg font-medium"><b>Nota:</b> ${o.note}</div>` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t flex justify-between items-center">
                        <span class="font-black text-slate-800 text-base">$${o.total.toLocaleString()}</span>
                        <div class="flex gap-1">
                            <button onclick="updateStatus('${o.id}', 'PREPARANDO')" class="px-2.5 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-xs font-bold">Cocinando</button>
                            <button onclick="updateStatus('${o.id}', 'LISTO')" class="px-2.5 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs font-bold">Listo</button>
                            <button onclick="deleteOrder('${o.id}')" class="px-2.5 py-1.5 bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700 rounded-lg text-xs font-bold"><i class="fas fa-check"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Conexión en Tiempo Real via SSE
        function connectStream() {
            const eventSource = new EventSource(`${SYNC_CHANNEL}/sse`);
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if(data && data.message) {
                        const order = JSON.parse(data.message);
                        if(order && order.id) {
                            addOrder(order);
                        }
                    }
                } catch(e) {}
            };

            eventSource.onerror = () => {
                setTimeout(connectStream, 3000);
            };
        }

        // Recuperar pedidos recientes al abrir
        async function fetchRecent() {
            try {
                const res = await fetch(`${SYNC_CHANNEL}/json?poll=1`);
                const text = await res.text();
                const lines = text.trim().split('\n');
                lines.forEach(line => {
                    try {
                        const parsed = JSON.parse(line);
                        if(parsed.message) {
                            const order = JSON.parse(parsed.message);
                            if(order && order.id) addOrder(order);
                        }
                    } catch(e) {}
                });
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
            fetchRecent();
            connectStream();
        });
    </script>
</body>
</html>
