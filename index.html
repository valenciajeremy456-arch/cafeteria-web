<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pedidos - Cafetería</title>
    <style>
        body {
            background-color: #1c1b22;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: #ff5500; margin: 0; }

        .btn-borrar-todo {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #lista-pedidos {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .pedido-card {
            background-color: #2b2a33;
            border-left: 6px solid #ff5500;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pedido-card:hover { background-color: #3b3a43; }
        .hora { color: #a0a0a0; font-size: 0.85em; }
        .info { font-size: 1.1em; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>☕ Pedidos Entrantes - Cafetería</h1>
        <button class="btn-borrar-todo" onclick="borrarTodoEnServidor()">🗑️ Limpiar Servidor ntfy</button>
    </div>

    <div id="lista-pedidos"></div>

    <script>
        const NTFY_TOPIC = 'cafeteria_pedidos_valencia';
        const NTFY_URL = `https://ntfy.sh/${NTFY_TOPIC}`;
        const contenedor = document.getElementById('lista-pedidos');
        const pedidosActivos = new Map();

        // Escuchar nuevos pedidos en tiempo real
        const eventSource = new EventSource(`${NTFY_URL}/sse`);

        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.event === 'message') {
                agregarPedido(data);
            }
        };

        function agregarPedido(data) {
            if (pedidosActivos.has(data.id)) return;

            const card = document.createElement('div');
            card.className = 'pedido-card';
            card.id = `pedido-${data.id}`;

            const hora = new Date(data.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            card.innerHTML = `
                <div class="hora">Hora: ${hora}</div>
                <div class="info">👤 <b>${data.title || 'Cliente'}</b>: ${data.message}</div>
                <small style="color: #888;">(Haz clic aquí para despachar y borrar)</small>
            `;

            // Al hacer clic, borra el pedido del servidor de ntfy
            card.addEventListener('click', () => despacharPedido(data.id));

            contenedor.prepend(card);
            pedidosActivos.set(data.id, card);
        }

        // Borra un pedido individual enviando petición DELETE a ntfy
        async function despacharPedido(id) {
            const card = pedidosActivos.get(id);
            if (card) {
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);
                pedidosActivos.delete(id);
            }
        }

        // Borra TODOS los pedidos acumulados en el servidor de ntfy.sh
        async function borrarTodoEnServidor() {
            if (confirm("¿Quieres eliminar todos los pedidos del servidor ntfy?")) {
                await fetch(NTFY_URL, { method: 'DELETE' });
                contenedor.innerHTML = '';
                pedidosActivos.clear();
            }
        }

        // Sincronizar estado inicial
        async function cargarPedidosIniciales() {
            const res = await fetch(`${NTFY_URL}/json?poll=1`);
            if (res.ok) {
                const text = await res.text();
                const lineas = text.trim().split('\n').filter(l => l);
                lineas.forEach(l => {
                    const msg = JSON.parse(l);
                    if (msg.event === 'message') agregarPedido(msg);
                });
            }
        }
        cargarPedidosIniciales();
    </script>
</body>
</html>
