<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Solicitud de Materiales</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { color: #ff6b00; margin: 0; }
        .estado { color: #00ff66; font-weight: bold; margin-bottom: 20px; }

        .btn-voz {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-voz:hover { background-color: #e05e00; }
        .btn-voz.activo { background-color: #28a745; }

        #lista-pedidos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pedido-card {
            background-color: #2a2a2a;
            border-left: 6px solid #ff6b00;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .pedido-card:hover { background-color: #383838; }
        .cliente { font-weight: bold; font-size: 1.1em; color: #ffffff; }
        .detalles { font-size: 0.95em; color: #ff9d00; margin-top: 4px; font-weight: bold; }
        .estudiante { font-size: 0.95em; color: #00e5ff; margin-top: 4px; }
        .producto { font-size: 1.1em; color: #ffffff; margin-top: 6px; font-weight: 500; }
        .tip { color: #888888; font-size: 0.8em; margin-top: 8px; }
    </style>

    <!-- Librerías de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="header-container">
        <h1>📦 Solicitudes de Útiles y Materiales</h1>
        <button id="btnVoz" class="btn-voz" onclick="toggleVoz()">🔇 Activar alerta por voz</button>
    </div>

    <div class="estado">🟢 Sistema de Almacén Conectado (Firebase)</div>

    <div id="lista-pedidos"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cafeteria-colegia-ccb-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('pedidos');
        const contenedor = document.getElementById('lista-pedidos');
        const btnVoz = document.getElementById('btnVoz');

        let vozActivada = false;
        let esCargaInicial = true;

        function toggleVoz() {
            vozActivada = !vozActivada;
            if (vozActivada) {
                btnVoz.textContent = "🔊 Alerta de Voz Activada";
                btnVoz.classList.add("activo");
                reproducirVoz("Sistema de alertas por voz activado");
            } else {
                btnVoz.textContent = "🔇 Activar alerta por voz";
                btnVoz.classList.remove("activo");
                window.speechSynthesis.cancel();
            }
        }

        function reproducirVoz(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            mensaje.pitch = 1.0;

            window.speechSynthesis.speak(mensaje);
        }

        setTimeout(() => { esCargaInicial = false; }, 1500);

        db.on('child_added', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();

            if (document.getElementById(`pedido-${id}`)) return;

            const card = document.createElement('div');
            card.className = 'pedido-card';
            card.id = `pedido-${id}`;

            const docenteNombre = typeof data === 'object' ? (data.cliente || 'Docente') : 'Docente';
            const aula = typeof data === 'object' ? (data.aula || 'Sin Aula') : 'Sin Aula';
            const estudiante = typeof data === 'object' ? (data.estudiante || 'Docente retira') : 'Docente retira';
            const materialSolicitado = typeof data === 'object' ? (data.pedido || data) : data;

            card.innerHTML = `
                <div class="cliente">👨‍🏫 Docente: ${docenteNombre}</div>
                <div class="detalles">📍 Ubicación: ${aula}</div>
                <div class="estudiante">🚶‍♂️ Recoge: ${estudiante}</div>
                <div class="producto">✏️ Material: ${materialSolicitado}</div>
                <div class="tip">(Haz clic para despachar y borrar de la pantalla)</div>
            `;

            if (vozActivada && !esCargaInicial) {
                let textoAnuncio = `Nueva solicitud del ${aula}. ${docenteNombre} requiere ${materialSolicitado}.`;
                if (estudiante !== 'Docente retira') {
                    textoAnuncio += ` Recoge el estudiante ${estudiante}.`;
                }
                reproducirVoz(textoAnuncio);
            }

            card.addEventListener('click', () => {
                db.child(id).remove();
            });

            contenedor.prepend(card);
        });

        db.on('child_removed', (snapshot) => {
            const id = snapshot.key;
            const card = document.getElementById(`pedido-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => card.remove(), 300);
            }
        });
    </script>
</body>
</html>
